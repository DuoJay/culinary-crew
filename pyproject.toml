[project]
name = "culinarycrew"
version = "0.1.0"
description = "CulinaryCrew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.95.0,<1.0.0"
]

[project.scripts]
culinarycrew = "culinarycrew.main:run"
run_crew = "culinarycrew.main:run"
train = "culinarycrew.main:train"
replay = "culinarycrew.main:replay"
test = "culinarycrew.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
